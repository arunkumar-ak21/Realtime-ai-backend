<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --user-msg-bg: #2563eb;
            --user-msg-text: #ffffff;
            --ai-msg-bg: #f1f5f9;
            --ai-msg-text: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: #334155;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--chat-bg);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
        }

        .status {
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            /* Start disconnected */
        }

        .status-dot.connected {
            background-color: #22c55e;
        }

        /* Reformatted layout for better responsiveness */
        @media (min-width: 800px) {
            .container {
                height: 90vh;
                margin-top: 5vh;
                border-radius: 1rem;
            }
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 0.25rem;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            color: var(--ai-msg-text);
            border-bottom-left-radius: 0.25rem;
        }

        .message.tool {
            align-self: center;
            font-size: 0.75rem;
            color: #64748b;
            background: transparent;
            padding: 0;
            max-width: 100%;
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--chat-bg);
        }

        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            background-color: var(--ai-msg-bg);
            padding: 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-color);
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.5rem;
            font-size: 1rem;
            color: #334155;
            outline: none;
            font-family: inherit;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Markdown-ish styling for AI response */
        .message.ai p {
            margin: 0 0 0.5rem 0;
        }

        .message.ai p:last-child {
            margin: 0;
        }

        .message.ai pre {
            background: #e2e8f0;
            padding: 0.5rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>AI Session</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="newChatBtn" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">New Chat</button>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <!-- Messages will appear here -->
            <div class="message ai">Hello! I'm your AI assistant. How can I help you today?</div>
        </div>

        <div class="input-area">
            <form id="chatForm" autocomplete="off">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Type your message..." required>
                    <button type="submit" id="sendBtn">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Utils
        function generateUUID() { // Simple UUID generator
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // State
        let sessionId = localStorage.getItem('chat_session_id') || generateUUID();
        localStorage.setItem('chat_session_id', sessionId);

        // For demo purposes, let's always create a new session or static one to not confuse user
        // let sessionId = "web-prototype-001";

        const chatArea = document.getElementById('chatArea');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');

        let ws;
        let currentAiMessageDiv = null;

        function clearChat() {
            // 1. Generate new ID
            sessionId = generateUUID();
            localStorage.setItem('chat_session_id', sessionId);

            // 2. Clear UI
            chatArea.innerHTML = '';

            // 3. Reconnect
            if (ws) {
                ws.onclose = null; // Prevent auto-reconnect temporarily
                ws.close();
            }
            connect();
        }

        if (newChatBtn) {
            newChatBtn.addEventListener('click', clearChat);
        }

        function connect() {
            // ws = new WebSocket(`ws://${window.location.host}/ws/session/${sessionId}`);
            // Assuming running on localhost:8000
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/session/${sessionId}`);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = "Connected";
                console.log("Connected to WS");
                loadHistory();
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = "Disconnected";
                setTimeout(connect, 3000); // Reconnect
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (!currentAiMessageDiv) {
                    currentAiMessageDiv = createMessageDiv('ai');
                    currentAiMessageDiv.dataset.rawDetails = ""; // Store raw text here
                }

                if (data.type === 'chunk') {
                    // Typing effect: just append text content
                    currentAiMessageDiv.textContent += data.content;
                    currentAiMessageDiv.dataset.rawDetails += data.content;
                    scrollToBottom();
                } else if (data.type === 'done') {
                    // Render Markdown
                    const rawText = currentAiMessageDiv.dataset.rawDetails;
                    currentAiMessageDiv.innerHTML = marked.parse(rawText);

                    // Syntax Highlight
                    currentAiMessageDiv.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });

                    currentAiMessageDiv = null; // Reset for next turn
                    scrollToBottom();
                }
            };
        }

        async function loadHistory() {
            try {
                const res = await fetch(`/sessions/${sessionId}/logs`);
                if (res.ok) {
                    const logs = await res.json();
                    chatArea.innerHTML = ''; // Clear current
                    logs.forEach(log => {
                        if (log.role === 'user') {
                            const div = createMessageDiv('user', false); // false = don't scroll recursively
                            div.textContent = log.content;
                        } else if (log.role === 'assistant') {
                            const div = createMessageDiv('ai', false);
                            //div.textContent = log.content;
                            div.innerHTML = marked.parse(log.content);
                            div.querySelectorAll('pre code').forEach((block) => {
                                hljs.highlightElement(block);
                            });
                        }
                        // Skip 'system' or 'tool'
                    });
                    scrollToBottom();
                }
            } catch (e) {
                console.error("Failed to load history:", e);
            }
        }

        function createMessageDiv(role, autoScroll = true) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            chatArea.appendChild(div);
            if (autoScroll) scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // User Message
            const userDiv = createMessageDiv('user');
            userDiv.textContent = text;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
                currentAiMessageDiv = null; // Prepare for new AI response
            } else {
                alert("Not connected to server.");
            }

            userInput.value = '';
        });

        // Initial connection
        connect();

    </script>
</body>

</html>
